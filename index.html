<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gündem & Teknoloji</title>
<meta name="description" content="Teknoloji ve gündem haberleri, her 30 dakikada bir güncellenir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#16161a; --muted:#6b6b74; --line:#e4e1d8;
  --accent:#e4402d; --tech:#2f5bea; --gundem:#e4402d; --editor:#0f8a5f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111114; --card:#1a1a1f; --ink:#ececf1; --muted:#9a9aa6; --line:#2a2a31;
  --accent:#ff5a45; --tech:#6d8cff; --gundem:#ff5a45; --editor:#34c38f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{border-bottom:2px solid var(--ink);padding-top:22px;padding-bottom:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(30px,6vw,52px);line-height:.95;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;text-align:right}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}

nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:500 14px Inter;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{margin-left:auto;min-width:160px;flex:0 1 240px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:14px Inter}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin:24px 0;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--line)}
.hero h2{font-family:Fraunces,serif;font-size:clamp(24px,3.4vw,36px);line-height:1.1;margin:10px 0}
.hero p{color:var(--muted);font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin:24px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:Fraunces,serif;font-weight:600;font-size:18px;line-height:1.25;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;padding-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chip{font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase}
.chip{color:var(--c,var(--accent))}
.empty{text-align:center;color:var(--muted);padding:60px 0}
#more{display:block;margin:0 auto 50px;padding:10px 26px}
#more[hidden]{display:none}
.hero:not(:has(img)){grid-template-columns:1fr}
footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:40px;color:var(--muted);font-size:13px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.meta{text-align:left}}

/* ---- haber sayfası ---- */
#article{display:none;max-width:760px;margin:0 auto;padding:22px 0 10px}
body.okuma #article{display:block}
body.okuma #hero,body.okuma #grid,body.okuma #more{display:none}
.back{display:block;background:none;border:0;color:var(--muted);font:500 14px Inter;cursor:pointer;padding:0;margin-bottom:18px}
.back:hover{color:var(--ink)}
#article h1{font-size:clamp(28px,4.6vw,44px);line-height:1.08;margin:10px 0 12px;font-weight:800}
#article .by{color:var(--muted);font-size:14px;margin-bottom:20px}
#article .cover{width:100%;border-radius:12px;margin-bottom:22px;background:var(--line)}
.text{font-size:18px;line-height:1.75}
.text p{margin:0 0 1.1em}
.text img{max-width:100%;border-radius:10px;margin:6px 0 18px;display:block}
.text a{color:var(--accent);text-decoration:underline;word-break:break-word}
.text a.src{display:inline-block;margin:6px 0 10px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font:600 15px Inter;text-decoration:none}
.note{font-size:13px;color:var(--muted)}
.related:empty{display:none}
.related{margin-top:30px;border-top:2px solid var(--ink);padding-top:18px}
.related h2{font:800 24px Fraunces,serif;margin:0 0 4px}

/* ---- yönetim modu ---- */
#admin{display:none;background:#16161a;color:#f6f4ef;font-size:14px}
body.yonetim #admin{display:block}
#admin .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px}
#admin b{margin-right:6px}
#admin a,#admin button{background:#2a2a31;color:#f6f4ef;border:0;border-radius:8px;padding:7px 12px;font:500 13px Inter;cursor:pointer}
#admin a:hover,#admin button:hover{background:#3a3a44}
#admin .end{margin-left:auto}
#panel{display:none;background:var(--card);border-bottom:1px solid var(--line)}
#panel.open{display:block}
#panel .wrap{padding-top:16px;padding-bottom:18px}
#panel h4{margin:14px 0 6px;font:600 14px Inter}
#panel li{font-size:13px;margin:4px 0;word-break:break-all}
#panel ul{margin:0;padding-left:18px}
.adm{display:none;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px}
body.yonetim .adm{display:flex}
.adm code{background:var(--bg);padding:2px 6px;border-radius:5px;user-select:all}
.adm a{color:var(--accent);font-weight:600}
.lnk{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="admin"><div class="wrap">
  <b>🔧 Yönetim</b>
  <a id="a-add" target="_blank" rel="noopener">＋ Haber ekle</a>
  <a id="a-set" target="_blank" rel="noopener">⚙️ Site ayarları</a>
  <button id="a-src">📡 Kaynaklar & kategoriler</button>
  <a id="a-log" target="_blank" rel="noopener">📋 Geçmiş</a>
  <button id="a-exit" class="end">Yönetimden çık</button>
</div></div>
<div id="panel"><div class="wrap" id="panel-in"></div></div>

<header class="wrap">
  <div class="top">
    <h1 id="title">Gündem<span>&amp;</span>Teknoloji</h1>
    <div class="meta"><span class="live"></span><span id="sub">Otomatik güncellenir</span><br><span id="upd">yükleniyor…</span></div>
  </div>
</header>

<nav><div class="wrap bar" id="tabs">
  <input id="q" type="search" placeholder="Haberlerde ara…">
</div></nav>

<main class="wrap">
  <section id="article"></section>
  <section id="related" class="related"></section>
  <section id="hero"></section>
  <section id="grid" class="grid"></section>
  <button id="more" class="tab" hidden>Daha fazla göster</button>
</main>

<footer class="wrap" id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
let all = [], cfg = {}, feeds = {}, cat = "hepsi", query = "", shown = 24;
const PALETTE = ["var(--tech)", "var(--gundem)", "#b7791f", "#8b5cf6", "#0e7490", "#db2777", "#4d7c0f"];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";

// ---------------------------------------------------------------- yönetim
const host = location.hostname.endsWith(".github.io") ? location.hostname : "";
const REPO = host ? host.split(".")[0] + "/" + host : "penomen06/penomen06.github.io";
function form(file, title, fields = {}){
  const p = new URLSearchParams({template: file, title});
  for (const [k, v] of Object.entries(fields)) if (v) p.set(k, v);
  return `https://github.com/${REPO}/issues/new?${p}`;
}
function isAdmin(){
  const want = new URLSearchParams(location.search).has("yonetim");
  try { if (want) localStorage.setItem("yonetim", "1"); return want || localStorage.getItem("yonetim") === "1"; }
  catch { return want; }
}
if (isAdmin()) document.body.classList.add("yonetim");
$("#a-exit").onclick = () => {
  try { localStorage.removeItem("yonetim"); } catch {}
  location.href = location.pathname;
};
$("#a-add").href = form("1-haber-ekle.yml", "[Haber] ");
$("#a-log").href = `https://github.com/${REPO}/issues?q=is%3Aissue`;
$("#a-src").onclick = () => $("#panel").classList.toggle("open");

function adminLinks(){
  $("#a-set").href = form("4-site-ayarlari.yml", "[Ayarlar] Site ayarları", {
    baslik: cfg.title, altyazi: cfg.subtitle, renk: cfg.accent, altbilgi: cfg.footer,
    adet: String(cfg.per_feed || ""), kelimeler: (cfg.blocked_words || []).join("\n")});
  const cats = cfg.categories || {};
  $("#panel-in").innerHTML = `<a class="lnk" target="_blank" rel="noopener" href="${esc(form("5-kaynak-kategori.yml", "[Kaynak] Yeni kaynak"))}">＋ Yeni kaynak veya kategori ekle</a>` +
    Object.entries(cats).map(([k, label]) => `<h4>${esc(label)}
      <a class="lnk" style="font-weight:500;font-size:12px;margin-left:8px" target="_blank" rel="noopener" href="${esc(form("5-kaynak-kategori.yml", "[Kaynak] " + label + " adını değiştir", {kategori: label}))}">adını değiştir / kaldır</a></h4>
      <ul>${(feeds[k] || []).map(u => `<li>${esc(u)} — <a class="lnk" target="_blank" rel="noopener" href="${esc(form("5-kaynak-kategori.yml", "[Kaynak] Kaldır", {kategori: label, rss: u}))}">kaldır</a></li>`).join("") || "<li>Kaynak yok</li>"}</ul>`).join("") +
    `<p style="font-size:12px;color:var(--muted);margin:14px 0 0">Formda yapmak istediğin işlemi "İşlem" kutusundan seç. Gönderdikten 1–2 dakika sonra sitede görünür.</p>`;
}

function adminRow(item){
  if (!item.id) return "";
  const t = item.title.slice(0, 60);
  return `<div class="adm"><span>ID <code>${esc(item.id)}</code></span>
    <a target="_blank" rel="noopener" href="${esc(form("2-haber-duzenle.yml", "[Düzenle] " + t, {haber_id: item.id, baslik: item.title, aciklama: (item.summary || "").length < 4000 ? item.summary : "", resim: item.image, link: item.link}))}">✏️ Düzenle / manşet</a>
    <a target="_blank" rel="noopener" href="${esc(form("3-haber-sil.yml", "[Sil] " + t, {haber_id: item.id}))}">🗑️ Sil</a></div>`;
}

// ---------------------------------------------------------------- görünüm
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s/60) + " dk önce";
  if (s < 86400) return Math.floor(s/3600) + " sa önce";
  return new Date(iso).toLocaleDateString("tr-TR", {day:"numeric", month:"long"});
}
const img = item => safeUrl(item.image) ? `<img src="${esc(item.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
const wrapLink = (item, inner) => item.id ? `<a href="#/haber/${encodeURIComponent(item.id)}">${inner}</a>` : inner;
// kart önizlemesi için metindeki resimleri ve fazla boşlukları temizler
const preview = t => String(t || "").replace(/!\[[^\]]*\]\([^)]*\)|<img[^>]*>/gi, " ").replace(/\s+/g, " ").trim();
function chip(item){
  if (item.source === "Editör") return `<span class="chip" style="--c:var(--editor)">Editör</span>`;
  const keys = Object.keys(cfg.categories || {});
  const label = (cfg.categories || {})[item.category] || item.category;
  return `<span class="chip" style="--c:${PALETTE[Math.max(0, keys.indexOf(item.category)) % PALETTE.length]}">${esc(label)}</span>`;
}
const foot = item => `<div class="foot"><span>${esc(item.source)}</span><span>${ago(item.date)}</span></div>`;
const card = item => `<article class="card">${wrapLink(item, img(item))}
    <div class="body">${chip(item)}<h3>${wrapLink(item, esc(item.title))}</h3>
      ${item.summary ? `<p>${esc(preview(item.summary))}</p>` : ""}${foot(item)}${adminRow(item)}</div></article>`;

function render(){
  let list = all.filter(i => cat === "hepsi" ? true : cat === "editor" ? i.manual : i.category === cat);
  if (query) list = list.filter(i => (i.title + " " + i.summary).toLocaleLowerCase("tr").includes(query));
  const lead = !query && (list.find(i => i.pinned) || list.find(i => i.image));
  $("#hero").innerHTML = lead ? `<div class="hero">${wrapLink(lead, img(lead))}
      <div>${chip(lead)}<h2>${wrapLink(lead, esc(lead.title))}</h2><p>${esc(preview(lead.summary).slice(0, 260))}</p>${foot(lead)}${adminRow(lead)}</div></div>` : "";
  const rest = list.filter(i => i !== lead);
  $("#grid").innerHTML = rest.slice(0, shown).map(card).join("") || (lead ? "" : `<div class="empty">Bu bölümde henüz haber yok.</div>`);
  $("#more").hidden = rest.length <= shown;
}

// ---------------------------------------------------------------- haber sayfası
function bodyHtml(raw){
  const imgs = [];
  const marked = String(raw || "")
    .replace(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)|<img[^>]*src="(https?:\/\/[^"]+)"[^>]*>/gi,
      (_, a, b) => `\u0000${imgs.push(a || b) - 1}\u0000`);
  return marked.split(/\n\s*\n/).map(par => {
    const h = esc(par.trim())
      .replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
      .replace(/\n/g, "<br>")
      .replace(/\u0000(\d+)\u0000/g, (_, i) => `</p><img src="${esc(imgs[i])}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><p>`);
    return h ? `<p>${h}</p>` : "";
  }).join("").replace(/<p>(\s|<br>)*<\/p>/g, "");
}

function showArticle(id){
  const item = all.find(i => String(i.id) === id);
  const el = $("#article");
  if (!item){
    el.innerHTML = `<button class="back" onclick="location.hash=''">← Ana sayfa</button><div class="empty">Bu haber artık yayında değil.</div>`;
    $("#related").innerHTML = "";
    return;
  }
  const date = new Date(item.date).toLocaleString("tr-TR", {day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"});
  const link = safeUrl(item.link);
  const cover = safeUrl(item.image) ? `<img class="cover" src="${esc(item.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  const text = item.manual
    ? bodyHtml(item.summary) + (link ? `<p class="note">Kaynak: <a href="${esc(link)}" target="_blank" rel="noopener">${esc(new URL(link).hostname)}</a></p>` : "")
    : (item.summary ? `<p>${esc(item.summary)}</p>` : "") + (link ? `<a class="src" href="${esc(link)}" target="_blank" rel="noopener">Haberin devamını ${esc(item.source)} sitesinde oku →</a>
       <p class="note">Bu özet ${esc(item.source)} tarafından yayınlanmıştır.</p>` : "");
  const related = all.filter(i => i !== item && i.category === item.category).slice(0, 6);
  el.innerHTML = `<button class="back" onclick="location.hash=''">← Tüm haberler</button>
    ${chip(item)}<h1>${esc(item.title)}</h1>
    <div class="by">${esc(item.source)} · ${date}</div>${cover}
    <div class="text">${text}</div>${adminRow(item)}`;
  $("#related").innerHTML = related.length ? `<h2>Benzer haberler</h2><div class="grid">${related.map(card).join("")}</div>` : "";
  document.title = item.title + " · " + cfg.title;
}

let lastHash = null;
function route(){
  const m = location.hash.match(/^#\/haber\/(.+)$/);
  document.body.classList.toggle("okuma", !!m);
  if (m) showArticle(decodeURIComponent(m[1]));
  else { $("#related").innerHTML = ""; document.title = cfg.title; }
  if (location.hash !== lastHash) window.scrollTo(0, 0);  // otomatik yenilemede sayfa kaymasın
  lastHash = location.hash;
}
window.addEventListener("hashchange", route);

function applySettings(){
  document.title = cfg.title;
  $("#title").innerHTML = esc(cfg.title).replace("&amp;", "<span>&amp;</span>");
  $("#sub").textContent = cfg.subtitle;
  $("#foot").textContent = cfg.footer;
  if (/^#[0-9a-f]{6}$/i.test(cfg.accent || "")) document.documentElement.style.setProperty("--accent", cfg.accent);
  const tabs = [["hepsi", "Tümü"], ...Object.entries(cfg.categories || {}), ["editor", "Editörün Seçtikleri"]];
  if (!tabs.some(([k]) => k === cat)) cat = "hepsi";
  document.querySelectorAll("#tabs .tab").forEach(b => b.remove());
  $("#q").insertAdjacentHTML("beforebegin", tabs.map(([k, l]) =>
    `<button class="tab${k === cat ? " on" : ""}" data-c="${esc(k)}">${esc(l)}</button>`).join(""));
  document.querySelectorAll("#tabs .tab").forEach(b => b.onclick = () => {
    cat = b.dataset.c; shown = 24; if (location.hash) location.hash = "";
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
}

async function load(){
  const get = f => fetch(f + "?t=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  const [news, manual, settings, fd] = await Promise.all(
    ["data/news.json", "data/manual.json", "data/settings.json", "data/feeds.json"].map(get));
  cfg = Object.assign({title: "Gündem & Teknoloji", subtitle: "Otomatik güncellenir", footer: "",
    categories: {teknoloji: "Teknoloji", gundem: "Gündem"}}, settings || {});
  feeds = fd || {};
  all = [...(manual || []), ...(news?.items || [])]
    .sort((a, b) => (b.pinned|0) - (a.pinned|0) || new Date(b.date) - new Date(a.date));
  $("#upd").textContent = news?.updated ? "Son güncelleme: " + ago(news.updated) : "";
  applySettings(); adminLinks(); render(); route();
}

$("#q").oninput = e => { query = e.target.value.trim().toLocaleLowerCase("tr"); shown = 24; render(); };
$("#more").onclick = () => { shown += 24; render(); };
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
